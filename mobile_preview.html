<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Preview｜面板資料庫</title>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(14, 22, 38, 0.86);
    --panel-soft: rgba(184, 212, 255, 0.08);
    --line: rgba(184, 212, 255, 0.24);
    --text: #eef4ff;
    --muted: #9fb3d0;
    --accent: #b8d4ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(184, 212, 255, 0.14), transparent 30rem),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 22px;
  }

  .preview-topbar {
    width: min(100%, 960px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .preview-title {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .preview-title h1 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.04em;
  }

  .preview-title p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
  }

  .device-controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  button,
  .open-link {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-soft);
    color: var(--accent);
    min-height: 34px;
    padding: 0 12px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
  }

  button:hover,
  .open-link:hover,
  button.active {
    border-color: rgba(184, 212, 255, 0.68);
    background: rgba(184, 212, 255, 0.15);
    color: var(--text);
  }

  .stage {
    width: min(100%, 960px);
    display: flex;
    justify-content: center;
  }

  .phone-shell {
    width: calc(var(--phone-w) + 28px);
    max-width: 100%;
    padding: 12px;
    border: 1px solid rgba(184, 212, 255, 0.32);
    border-radius: 42px;
    background:
      linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 22%),
      rgba(13, 20, 35, 0.82);
    box-shadow:
      0 26px 80px rgba(0, 0, 0, 0.46),
      inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  }

  .phone-screen {
    width: var(--phone-w);
    height: var(--phone-h);
    max-width: calc(100vw - 72px);
    border: 1px solid rgba(184, 212, 255, 0.28);
    border-radius: 32px;
    overflow: hidden;
    background: #050914;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #050914;
  }

  .note {
    width: min(100%, 960px);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
  }

  @media (max-width: 720px) {
    body {
      padding: 14px;
      gap: 12px;
    }

    .preview-topbar {
      flex-direction: column;
      align-items: stretch;
    }

    .device-controls {
      justify-content: flex-start;
    }

    .phone-shell {
      padding: 8px;
      border-radius: 30px;
    }

    .phone-screen {
      max-width: calc(100vw - 46px);
      height: min(var(--phone-h), calc(100vh - 168px));
      border-radius: 24px;
    }
  }
</style>
</head>
<body style="--phone-w: 393px; --phone-h: 852px;">
  <header class="preview-topbar">
    <div class="preview-title">
      <h1>Mobile Preview</h1>
      <p>這個頁面只用來預覽手機版，不會影響正式的面板資料庫。</p>
    </div>
    <div class="device-controls" aria-label="選擇預覽尺寸">
      <button type="button" class="active" data-width="393" data-height="852">iPhone 15</button>
      <button type="button" data-width="390" data-height="844">iPhone 12</button>
      <button type="button" data-width="375" data-height="667">iPhone SE</button>
      <button type="button" data-width="430" data-height="932">Large</button>
      <a class="open-link" href="./index.html" target="_blank" rel="noopener">開啟原頁</a>
    </div>
  </header>

  <main class="stage">
    <div class="phone-shell">
      <div class="phone-screen">
        <iframe src="./index.html" title="面板資料庫手機版預覽"></iframe>
      </div>
    </div>
  </main>

  <p class="note">
    如果放到 GitHub Pages，請把這個檔案和 index.html 放在同一層；它會直接讀同一份網站與資料來源。
  </p>

<script>
  const buttons = document.querySelectorAll('[data-width]');
  buttons.forEach((button) => {
    button.addEventListener('click', () => {
      document.body.style.setProperty('--phone-w', `${button.dataset.width}px`);
      document.body.style.setProperty('--phone-h', `${button.dataset.height}px`);
      buttons.forEach((item) => item.classList.toggle('active', item === button));
    });
  });
</script>
</body>
</html>
